<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Capsule - FUTURE SELF</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <header class="header">

            <h1>CREATE YOUR TIME CAPSULE</h1>

        </header>

        <main class="content">

            <h3>Who are you writing to?</h3>

            <p>Your future self</p>

            <h3>When should this message be opened?</h3>

            <input type="date" id="capsule-date" name="capsule-date">

            <label for="msg">Your message:</label>

            <textarea 
                id="msg"
                name="msg"
                placeholder="Dear future me,"></textarea>

        </main>

        <footer class="footer">

            <a href="capsule.html"> 🔒 Seal Capsule </a>

        </footer>
    </div>
    
</body>
</html>
